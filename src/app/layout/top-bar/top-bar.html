<ng-container *transloco="let t">
	<div class="top-bar__trail">
		<a class="top-bar__brand" routerLink="/dashboard">{{ t('app.name') }}</a>

		<hub-breadcrumb>
			<ng-template hubBreadcrumbItem let-item let-isLast="isLast">
				@if (isLast) {
					<span>{{ t(item.label) }}</span>
				} @else {
					<a [routerLink]="item.url">{{ t(item.label) }}</a>
				}
			</ng-template>
		</hub-breadcrumb>
	</div>

	<div class="top-bar__actions">
		<div class="top-bar__languages" role="group" [attr.aria-label]="t('language.label')">
			@for (language of languages.available; track language) {
				<button
					hubButton
					size="sm"
					color="primary"
					[variant]="languages.language() === language ? 'solid' : 'ghost'"
					[attr.aria-pressed]="languages.language() === language"
					(click)="selectLanguage(language)"
				>
					{{ language | uppercase }}
				</button>
			}
		</div>

		<button
			hubButton
			size="sm"
			variant="ghost"
			color="primary"
			[attr.aria-label]="theme.isDark() ? t('theme.toLight') : t('theme.toDark')"
			(click)="theme.toggle()"
		>
			<hub-icon [name]="theme.isDark() ? 'moon' : 'sun'" size="1.15rem" color="var(--hub-sys-text-primary)" />
		</button>
	</div>
</ng-container>
