<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Hub PM</title>
		<base href="/" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="A project management app built only with Hub UI packages." />
		<link rel="icon" type="image/x-icon" href="favicon.ico" />
		<script>
			// Paint the stored theme before Angular boots, so a returning visitor
			// never sees the light theme flash before the dark one takes over.
			(function () {
				try {
					var stored = localStorage.getItem('hub-pm.theme');
					var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					document.documentElement.dataset.theme = stored || (prefersDark ? 'dark' : 'light');
				} catch (error) {
					document.documentElement.dataset.theme = 'light';
				}
			})();
		</script>
	</head>
	<body>
		<app-root></app-root>
	</body>
</html>
