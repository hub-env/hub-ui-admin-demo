server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# The app routes on the client, so any path that is not a file on disk
	# has to come back as index.html — otherwise a reload on /projects is a
	# 404 from nginx rather than a screen.
	location / {
		try_files $uri $uri/ /index.html;
	}

	# Hashed assets can be cached hard; index.html never, or a deploy takes
	# a browser refresh to be seen.
	location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
		expires 1y;
		add_header Cache-Control "public, immutable";
	}

	location = /index.html {
		add_header Cache-Control "no-cache";
	}

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;
	gzip_min_length 1024;
}
